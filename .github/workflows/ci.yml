name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare WXT
        run: npx wxt prepare

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: .output/chrome-mv3
          if-no-files-found: error

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        with:
          name: firefox-mv3
          path: .output/firefox-mv3
          if-no-files-found: error
